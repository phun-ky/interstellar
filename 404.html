<!doctype html>
<html lang="en-GB" class="int">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal lost · Interstellar</title>
    <meta
      name="description"
      content="There is nothing at this address on the Interstellar site."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#4feff9" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%images/icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%BASE_URL%images/icons/icon-16x16.png"
    />
    <link rel="stylesheet" href="/src/styles/not-found.css" />
  </head>
  <body class="int">
    <header class="int mc-header">
      <a class="int mc-brand" href="%BASE_URL%">
        <svg
          class="int"
          width="30"
          height="30"
          viewBox="0 0 300 300"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="150"
            cy="150"
            r="60"
            stroke="currentColor"
            stroke-width="10"
          />
          <ellipse
            cx="150"
            cy="150"
            rx="120"
            ry="40"
            stroke="currentColor"
            stroke-width="6"
          />
          <circle
            cx="150"
            cy="150"
            r="110"
            stroke="currentColor"
            stroke-width="4"
            stroke-dasharray="8 8"
          />
          <circle cx="210" cy="150" r="10" fill="currentColor" />
        </svg>
        <span class="int mc-brand-name">Interstellar</span>
      </a>
      <div class="int mc-header-status">
        <span class="int mc-status is-hold">◌ signal lost</span>
      </div>
    </header>

    <main class="int mc-lost">
      <section class="int mc-panel" aria-labelledby="lostTitle">
        <p class="int mc-popup-kind">// Error 404</p>
        <h1 class="int mc-lost-title" id="lostTitle">Signal lost</h1>
        <p class="int">There is nothing at this address.</p>
        <a class="int mc-button" href="%BASE_URL%">Return to the map</a>
      </section>
    </main>
  </body>
</html>
