<!doctype html>
<html lang="en-GB" class="int">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interstellar</title>
    <meta
      name="description"
      content="A project journey to simulate our galaxy 1:1"
    />
    <meta name="author" content="Alexander Vassbotn Røyne-Helgesen" />
    <meta name="copyright" content="Alexander Vassbotn Røyne-Helgesen" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Interstellar" />
    <link rel="canonical" href="%SITE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Interstellar" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Interstellar" />
    <meta
      property="og:description"
      content="A project journey to simulate our galaxy 1:1"
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Interstellar map: the solar system's orbits around the Sun on a starfield, with the telemetry and systems panels."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="The Interstellar map: the solar system's orbits around the Sun on a starfield, with the telemetry and systems panels."
    />

    <meta name="msapplication-TileColor" content="#4feff9" />
    <meta name="msapplication-config" content="browserconfig.xml" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4feff9" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%images/icons/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%images/icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="%BASE_URL%images/icons/icon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%BASE_URL%images/icons/icon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%images/icons/icon-180x180.png"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Interstellar" />
  </head>
  <body class="int">
    <a class="int mc-skip" href="#systems">Skip to systems</a>

    <main class="int">
      <canvas
        id="spaceCanvas"
        role="img"
        aria-label="Map of the solar system, nearby stars and the Milky Way. The bodies on screen are listed under In view."
      ></canvas>
    </main>

    <header class="int mc-header">
      <a class="int mc-brand" href="%BASE_URL%">
        <svg
          class="int"
          width="30"
          height="30"
          viewBox="0 0 300 300"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="150"
            cy="150"
            r="60"
            stroke="currentColor"
            stroke-width="10"
          />
          <ellipse
            cx="150"
            cy="150"
            rx="120"
            ry="40"
            stroke="currentColor"
            stroke-width="6"
          />
          <circle
            cx="150"
            cy="150"
            r="110"
            stroke="currentColor"
            stroke-width="4"
            stroke-dasharray="8 8"
          />
          <circle cx="210" cy="150" r="10" fill="currentColor" />
        </svg>
        <span class="int mc-brand-name">Interstellar</span>
      </a>
      <div class="int mc-header-status" role="status">
        <span class="int mc-callsign" id="lockStatus" hidden>
          // Lock: <span class="int" id="lockStatusName"></span>
        </span>
        <span class="int mc-status" id="simStatus">● nominal</span>
      </div>
      <!-- Sound: the background sound and the switch sounds, off on every visit -->
      <button
        type="button"
        class="int mc-sound"
        id="soundToggle"
        aria-pressed="false"
        data-sound
      >
        <svg
          class="int mc-sound-icon"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          aria-hidden="true"
        >
          <path d="M3 7.5h3l4.5-3.5v12L6 12.5H3z" fill="currentColor" />
          <path
            class="int mc-sound-mute"
            d="M13.5 7.5l4 5M17.5 7.5l-4 5"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            class="int mc-sound-waves"
            d="M13 7.2a3.6 3.6 0 0 1 0 5.6M15.2 4.8a7 7 0 0 1 0 10.4"
            stroke="currentColor"
            stroke-width="1.5"
            fill="none"
          />
        </svg>
        <span class="int">Sound</span
        ><span class="int mc-sound-state" aria-hidden="true">off</span>
      </button>
      <nav class="int mc-nav" aria-label="Main">
        <button
          class="int mc-menu"
          type="button"
          aria-expanded="false"
          aria-controls="mainMenu"
        >
          <svg
            class="int"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            aria-hidden="true"
          >
            <path
              d="M2 5h16M2 10h16M2 15h16"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
          <span class="int sr-only">Menu</span>
        </button>
        <ul class="int mc-nav-links" id="mainMenu">
          <li class="int">
            <a class="int" href="https://phun-ky.net/interstellar-tools/"
              >Tools</a
            >
          </li>
          <li class="int">
            <a class="int" href="https://github.com/sponsors/phun-ky"
              >Sponsor<span class="int mc-external" aria-hidden="true"
                >↗</span
              ></a
            >
          </li>
          <li class="int">
            <a
              class="int"
              href="https://github.com/phun-ky/site-interstellar/blob/main/CONTRIBUTING.md"
              >Contributing<span class="int mc-external" aria-hidden="true"
                >↗</span
              ></a
            >
          </li>
          <li class="int mc-nav-icon">
            <a
              class="int"
              href="https://github.com/phun-ky/site-interstellar"
              aria-label="GitHub repository"
            >
              <svg
                class="int"
                width="20"
                height="20"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
                />
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="int mc-left">
      <section class="int mc-panel" aria-labelledby="telemetryTitle">
        <h2 class="int mc-ptitle" id="telemetryTitle">
          <span class="int">Telemetry</span><b class="int">TLM-01</b>
        </h2>
        <p class="int mc-date" id="simDate"></p>
        <dl class="int mc-cells">
          <div class="int">
            <dt class="int">Scale</dt>
            <dd class="int" id="scaleDisplay"></dd>
          </div>
          <div class="int">
            <dt class="int">Zoom</dt>
            <dd class="int" id="zoomLevel"></dd>
          </div>
          <div class="int mc-coord">
            <dt class="int">X</dt>
            <dd class="int" id="coordX"></dd>
          </div>
          <div class="int mc-coord">
            <dt class="int">Y</dt>
            <dd class="int" id="coordY"></dd>
          </div>
        </dl>
      </section>
      <div class="int in-viewport" id="in-viewport"></div>
    </div>

    <aside
      class="int controls"
      id="systems"
      tabindex="-1"
      aria-labelledby="systemsTitle"
    >
      <div class="int inner">
        <h2 class="int mc-ptitle" id="systemsTitle">
          <span class="int">Systems</span><b class="int">SYS-01</b>
        </h2>
        <div class="int" id="options"></div>
      </div>
    </aside>

    <!-- Narrow screens: Hold, Sound and the Systems sheet, at the bottom -->
    <div class="int mc-dock">
      <button
        type="button"
        class="int mc-button"
        id="pauseDock"
        aria-pressed="false"
      >
        Hold
      </button>
      <button
        type="button"
        class="int mc-button mc-button-secondary mc-dock-sound"
        id="soundDock"
        aria-pressed="false"
        data-sound
      >
        <svg
          class="int mc-sound-icon"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          aria-hidden="true"
        >
          <path d="M3 7.5h3l4.5-3.5v12L6 12.5H3z" fill="currentColor" />
          <path
            class="int mc-sound-mute"
            d="M13.5 7.5l4 5M17.5 7.5l-4 5"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            class="int mc-sound-waves"
            d="M13 7.2a3.6 3.6 0 0 1 0 5.6M15.2 4.8a7 7 0 0 1 0 10.4"
            stroke="currentColor"
            stroke-width="1.5"
            fill="none"
          />
        </svg>
        <span class="int">Sound</span>
      </button>
      <button
        type="button"
        class="int mc-button mc-button-secondary"
        id="systemsToggle"
        aria-expanded="false"
        aria-controls="systems"
      >
        Systems
      </button>
    </div>

    <section
      class="int mc-panel mc-popup"
      id="bodyInfo"
      aria-labelledby="bodyInfoTitle"
      hidden
    >
      <div class="int mc-popup-head">
        <div class="int">
          <p class="int mc-popup-kind" id="bodyInfoKind"></p>
          <h2 class="int mc-popup-title" id="bodyInfoTitle">Body</h2>
        </div>
        <button
          type="button"
          class="int mc-popup-close"
          id="bodyInfoClose"
          aria-label="Close"
        >
          ×
        </button>
      </div>
      <dl class="int mc-cells" id="bodyInfoFacts"></dl>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
