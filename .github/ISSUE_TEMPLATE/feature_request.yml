name: Feature request
description: Suggest something new for the simulation or the page
labels: ['✨ feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How it could work, as concretely as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get there, and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Sketches, links to data sources, or examples from elsewhere.
