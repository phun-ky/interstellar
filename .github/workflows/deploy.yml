# Check, build and deploy the site to GitHub Pages on every push to main:
# https://phun-ky.net/interstellar/
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job can publish to Pages
permissions:
  contents: read

# One deployment at a time. A run waits for the one before it to finish, and
# a run still waiting is replaced by a newer one, so the latest main wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same checks as on pull requests; nothing is built or deployed unless
  # they all pass
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read # configure-pages reads the site's Pages settings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: what is deployed is installed fresh from the lockfile
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment's origin
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
