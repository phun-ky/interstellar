name: Links

# External links break without any change here, so they are checked on a
# schedule and never block a pull request. The end-to-end tests check every
# internal link and asset on each pull request.
on:
  schedule:
    # Mondays at 06:17 UTC
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # Runs on pull requests that change this workflow, to test the change
  pull_request:
    paths:
      - .github/workflows/links.yml

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external:
    name: External links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Markdown documents and the built pages. Only http and https links:
      # the built pages' own paths are checked by the end-to-end tests.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --scheme https --scheme http --exclude-loopback
            --max-retries 3 --accept 200,206,429 './*.md' './.github/**/*.md'
            './dist/*.html'
          fail: true
          # The action downloads this release; set here so it changes on purpose
          lycheeVersion: v0.24.2
